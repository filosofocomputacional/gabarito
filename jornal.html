<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jornal Escolar</title>
  <style>
    /* Estilos Gerais */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
    }

    /* Grid de Notícias */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 20px auto;
    }

    /* Cards/Thumbnails */
    .news-card {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .news-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 12px rgba(0,0,0,0.15);
    }
    .news-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }
    .news-card-content {
      padding: 15px;
    }
    .news-card h3 {
      margin: 0 0 10px 0;
      font-size: 1.1rem;
      color: #2c3e50;
    }
    .news-card .author {
      font-size: 0.85rem;
      color: #7f8c8d;
    }

    /* Modal (Popup) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 1.5rem;
      background: none;
      border: none;
      cursor: pointer;
    }
    .modal-body img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 5px;
      margin-bottom: 15px;
    }
    .modal-body p {
      line-height: 1.6;
      color: #444;
      white-space: pre-wrap; /* Preserva parágrafos do texto */
    }
  </style>
</head>
<body>

  <h1>📰 Jornal Escolar</h1>
  
  <!-- Container onde as notícias serão carregadas -->
  <div id="news-grid" class="news-grid">
    <p id="loading">Carregando notícias...</p>
  </div>

  <!-- Modal / Popup -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" onclick="fecharModal()">&times;</button>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script>
    //Cole aqui a URL que você gerou no Apps Script
    const API_URL = "https://script.google.com/macros/s/AKfycbxKQAWe2eGEnxUttQWHX_F12WalG4X6niIYuqU7Azsrntw7taJXUlq-QzEi_nO9mbLK/exec";

    async function carregarNoticias() {
      try {
        const resposta = await fetch(API_URL);
        const noticias = await resposta.json();

        const grid = document.getElementById('news-grid');
        grid.innerHTML = ''; // Limpa a mensagem de carregando

        // Pega apenas as 10 primeiras notícias
        const primeirasNoticias = noticias.slice(0, 10);

        primeirasNoticias.forEach(noticia => {
          const card = document.createElement('div');
          card.className = 'news-card';
          
          card.innerHTML = `
            <img src="${noticia.Imagem || 'https://via.placeholder.com/300x180?text=Sem+Imagem'}" alt="${noticia.Chamada}">
            <div class="news-card-content">
              <h3>${noticia.Chamada}</h3>
              <p class="author">Por: ${noticia.Redator || 'Redação'}</p>
            </div>
          `;

          // Evento de clique para abrir o modal
          card.addEventListener('click', () => abrirModal(noticia));

          grid.appendChild(card);
        });

      } catch (erro) {
        document.getElementById('news-grid').innerHTML = '<p>Erro ao carregar as notícias.</p>';
        console.error('Erro:', erro);
      }
    }

    function abrirModal(noticia) {
      const modalBody = document.getElementById('modal-body');
      modalBody.innerHTML = `
        <h2>${noticia.Chamada}</h2>
        <p><strong>Por:</strong> ${noticia.Redator || 'Redação'}</p>
        ${noticia.Imagem ? `<img src="${noticia.Imagem}" alt="${noticia.Chamada}">` : ''}
        <p>${noticia.Noticia}</p>
      `;
      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function fecharModal() {
      document.getElementById('modal-overlay').style.display = 'none';
    }

    // Fecha o modal se clicar fora do conteúdo
    window.onclick = function(event) {
      const modal = document.getElementById('modal-overlay');
      if (event.target === modal) {
        fecharModal();
      }
    };

    // Inicializa o carregamento das notícias
    carregarNoticias();
  </script>
</body>
</html>
