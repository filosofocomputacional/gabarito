<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEMORIAL - E.E. Nova Contagem</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-site: #f7f8fa;
            --cor-primaria: #0d1b2a;
            --cor-card-dark: #0f2338;
            --cor-destaque: #d4a373;
            --texto-principal: #1f2937;
            --texto-secundario: #6b7280;
            --raio-borda: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-site);
            color: var(--texto-principal);
            padding-bottom: 60px;
        }

        /* --- CABEÇALHO --- */
        header {
            background-color: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 30px 20px;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .titulo-escola h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: var(--cor-primaria);
            letter-spacing: -0.5px;
        }

        .titulo-escola p {
            color: var(--texto-secundario);
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .selo-40anos {
            background-color: var(--cor-primaria);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
        }

        .selo-40anos span {
            color: var(--cor-destaque);
            font-weight: 700;
            font-size: 1.2rem;
        }

        /* --- GRID PRINCIPAL (DESKTOP) --- */
        .grid-container {
            max-width: 1200px;
            margin: 40px auto 0;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        /* CARD BASE */
        .card {
            background: #ffffff;
            border-radius: var(--raio-borda);
            border: 1px solid #e5e7eb;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.08);
        }

        .card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .card-tag {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--cor-destaque);
            margin-bottom: 8px;
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            line-height: 1.35;
            color: var(--cor-primaria);
            margin-bottom: 12px;
        }

        .card-author {
            font-size: 0.85rem;
            color: var(--texto-secundario);
            margin-top: auto;
        }

        /* VARIATAS DE TAMANHO PARA O DESKTOP */
        
        /* 1. Card Grande (Ocupa 2 colunas) */
        .card-destaque-2col {
            grid-column: span 2;
        }
        .card-destaque-2col .card-img {
            height: 280px;
        }
        .card-destaque-2col .card-title {
            font-size: 1.6rem;
        }

        /* 2. Banner Horizontal Escuro (Ocupa a largura total de 3 colunas) */
        .card-banner-full {
            grid-column: 1 / -1;
            flex-direction: row;
            background-color: var(--cor-card-dark);
            border: none;
            color: #ffffff;
        }
        .card-banner-full .card-img {
            width: 48%;
            height: 320px;
        }
        .card-banner-full .card-body {
            width: 52%;
            padding: 36px;
        }
        .card-banner-full .card-title {
            color: #ffffff;
            font-size: 1.8rem;
            margin-bottom: 16px;
        }
        .card-banner-full .card-author {
            color: #9ca3af;
        }

        /* --- MODAL / POPUP --- */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 27, 42, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(6px);
        }

        .modal-content {
            background: #ffffff;
            padding: 36px;
            border-radius: var(--raio-borda);
            width: 90%;
            max-width: 720px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 18px;
            right: 22px;
            font-size: 1.8rem;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--texto-secundario);
        }

        .modal-body img {
            width: 100%;
            max-height: 380px;
            object-fit: cover;
            border-radius: 10px;
            margin: 20px 0;
        }

        .modal-body p {
            line-height: 1.8;
            color: #374151;
            font-size: 1.05rem;
            white-space: pre-wrap;
        }

        /* --- RESPONSIVIDADE (CELULAR E TABLET PEQUENO) --- */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            .grid-container {
                grid-template-columns: 1fr; /* Força 1 coluna única no celular */
                gap: 20px;
            }

            /* Reseta todas as variações de tamanho para o padrão de celular */
            .card-destaque-2col,
            .card-banner-full {
                grid-column: span 1 !important;
                flex-direction: column !important;
            }

            .card-banner-full .card-img,
            .card-banner-full .card-body {
                width: 100% !important;
            }

            .card-banner-full .card-img {
                height: 200px !important;
            }

            .card-banner-full {
                background-color: #ffffff;
                border: 1px solid #e5e7eb;
                color: var(--texto-principal);
            }

            .card-banner-full .card-title {
                color: var(--cor-primaria);
                font-size: 1.25rem;
            }

            .card-banner-full .card-author {
                color: var(--texto-secundario);
            }

            .modal-content {
                padding: 24px 18px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="titulo-escola">
                <h1>E.E. Nova Contagem</h1>
                <p>Memorial & Jornal Escolar Digital</p>
            </div>
            <div class="selo-40anos">
                <span>40</span> Anos de História (1986 — 2026)
            </div>
        </div>
    </header>

    <main class="grid-container" id="news-grid">
        <p style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #6b7280;">
            Carregando edições...
        </p>
    </main>

    <div class="modal" id="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="fecharModal()">&times;</button>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxKQAWe2eGEnxUttQWHX_F12WalG4X6niIYuqU7Azsrntw7taJXUlq-QzEi_nO9mbLK/exec";

        async function carregarNoticias() {
            try {
                const resposta = await fetch(API_URL);
                const noticias = await resposta.json();
                const grid = document.getElementById('news-grid');
                grid.innerHTML = '';

                const dezPrimeiras = noticias.slice(0, 10);

                dezPrimeiras.forEach((noticia, index) => {
                    const card = document.createElement('article');
                    card.className = 'card';

                    // Lógica para variar o tamanho das notícias no computador
                    if (index === 0) {
                        // Notícia 1: Destaque grande (2 colunas)
                        card.classList.add('card-destaque-2col');
                    } else if (index === 2) {
                        // Notícia 3: Banner horizontal (largura total)
                        card.classList.add('card-banner-full');
                    } else if (index === 6) {
                        // Notícia 7: Outro destaque em 2 colunas
                        card.classList.add('card-destaque-2col');
                    }

                    const imagemFallback = 'https://placehold.co/600x400/0f2338/ffffff?text=E.E.+Nova+Contagem';

                    card.innerHTML = `
                        <img class="card-img" src="${noticia.Imagem || imagemFallback}" alt="Imagem de capa">
                        <div class="card-body">
                            <div>
                                <div class="card-tag">Notícia #${index + 1}</div>
                                <h2 class="card-title">${noticia.Chamada}</h2>
                            </div>
                            <p class="card-author">Por: ${noticia.Redator || 'Redação'}</p>
                        </div>
                    `;

                    card.addEventListener('click', () => abrirModal(noticia));
                    grid.appendChild(card);
                });
            } catch (erro) {
                console.error("Erro ao carregar dados:", erro);
                document.getElementById('news-grid').innerHTML = `
                    <p style="grid-column: 1 / -1; text-align: center; color: #ef4444; padding: 40px;">
                        Erro ao carregar as notícias. Verifique a conexão com a planilha.
                    </p>`;
            }
        }

        function abrirModal(noticia) {
            const body = document.getElementById('modal-body');
            const imagemFallback = 'https://placehold.co/600x400/0f2338/ffffff?text=E.E.+Nova+Contagem';

            body.innerHTML = `
                <h2 style="font-family: 'Playfair Display', serif; font-size: 1.8rem; color: #0d1b2a; margin-bottom: 8px;">
                    ${noticia.Chamada}
                </h2>
                <p style="color: #6b7280; font-size: 0.9rem; margin-bottom: 16px;">
                    Redação: <strong>${noticia.Redator || 'Redação Escolar'}</strong>
                </p>
                <img src="${noticia.Imagem || imagemFallback}" alt="Imagem da notícia">
                <p>${noticia.Noticia}</p>
            `;
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        window.onclick = function(e) {
            if (e.target.id === 'modal-overlay') fecharModal();
        }

        carregarNoticias();
    </script>
</body>
</html>
