<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CorrigePro - Captura Automática</title>
    <style>
        :root {
            --primary: #007bff;
            --success: #28a745;
            --danger: #dc3545;
            --dark: #343a40;
            --light: #f8f9fa;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f4f7f6; color: #333; }
        header { background: var(--dark); color: white; padding: 15px; text-align: center; }
        nav { display: flex; justify-content: center; background: #e9ecef; border-bottom: 2px solid #ccc; }
        .tab-btn { background: none; border: none; padding: 15px 25px; cursor: pointer; font-size: 16px; font-weight: bold; color: #555; }
        .tab-btn.active { border-bottom: 3px solid var(--primary); color: var(--primary); }
        .container { max-width: 900px; margin: 20px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .form-control { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
        .btn-action { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; background: var(--primary); width: 100%; margin-top: 10px;}
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--danger); }
        
        .slider-group { margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
        .slider-group label { width: 60%; font-size: 14px; font-weight: bold;}
        .slider-group input { width: 35%; }
        
        .grid-gabarito { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 15px; }
        .questao-item { display: flex; justify-content: space-between; align-items: center; background: var(--light); padding: 5px 10px; border-radius: 4px; border: 1px solid #ddd;}
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: var(--light); }
        
        /* Modal da Câmera */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); }
        .modal-content { background-color: white; margin: 5% auto; padding: 20px; border-radius: 8px; width: 90%; max-width: 600px; position: relative; text-align: center; }
        .btn-close-modal { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; border: none; background: none; }
        
        .video-container { position: relative; display: inline-block; margin-top: 15px; }
        video, canvas { max-width: 100%; border: 2px solid #333; border-radius: 4px; }
        #canvasOverlay { position: absolute; top: 0; left: 0; z-index: 10; }
        
        #statusCv { text-align: center; font-weight: bold; padding: 10px; background: #fff3cd; color: #856404; margin-bottom: 15px; border-radius: 4px; }
    </style>
</head>
<body>

<header>
    <h2 style="margin: 0;">🎓 CorrigePro - OpenCV AutoCapture</h2>
</header>

<nav>
    <button class="tab-btn active" onclick="trocarAba('abaCorrecao', this)">📝 Correção</button>
    <button class="tab-btn" onclick="trocarAba('abaCalibragem', this)">⚙️ Calibragem</button>
</nav>

<div class="container">
    <div id="statusCv">⏳ Baixando motor de visão computacional (OpenCV.js)... aguarde.</div>

    <!-- ================= ABA 1: CORREÇÃO ================= -->
    <div id="abaCorrecao" class="tab-content active">
        <p>Alunos para correção (Demonstração):</p>
        <table>
            <thead>
                <tr>
                    <th>Nome do Aluno</th>
                    <th style="text-align: center; width: 100px;">Capturar</th>
                    <th style="text-align: center; width: 100px;">Nota</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>João Silva</td>
                    <td style="text-align: center;"><button class="btn-action" style="margin:0; padding: 5px;" onclick="abrirCamera('João Silva')">📸</button></td>
                    <td style="text-align: center; font-weight: bold;" id="nota-joao">-</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- ================= ABA 2: CALIBRAGEM ================= -->
    <div id="abaCalibragem" class="tab-content">
        <h3>🎛️ Grade Automática e Gabarito</h3>
        
        <div style="display: flex; gap: 15px; margin-bottom: 15px;">
            <div style="flex: 1;">
                <label><strong>Valor da Prova:</strong></label>
                <input type="number" id="inputValorProva" class="form-control" value="10.0" step="0.1" onchange="salvarConfig()">
            </div>
            <div style="flex: 1;">
                <label><strong>Número de Colunas:</strong></label>
                <select id="selectColunas" class="form-control" onchange="salvarConfig()">
                    <option value="1">1 Coluna</option>
                    <option value="2" selected>2 Colunas</option>
                    <option value="3">3 Colunas</option>
                    <option value="4">4 Colunas</option>
                </select>
            </div>
        </div>

        <div style="background: var(--light); padding: 15px; border-radius: 5px; margin-bottom: 15px; text-align: center;">
            <label><strong>Quantidade de Questões:</strong></label><br>
            <button class="btn-action btn-danger" style="width: auto; display: inline-block;" onclick="mudarQtdQuestoes(-1)">- Menos</button>
            <span id="txtQtdQuestoes" style="font-size: 18px; font-weight: bold; margin: 0 15px;">10</span>
            <button class="btn-action btn-success" style="width: auto; display: inline-block;" onclick="mudarQtdQuestoes(1)">+ Mais</button>
        </div>

        <h4 style="border-bottom: 1px solid #ddd; padding-bottom: 5px;">🎛️ Posição e Alinhamento</h4>
        <div class="slider-group"><label>Posição X da 1ª Coluna: <span id="val_x_inicial">50</span></label><input type="range" id="x_inicial" min="0" max="300" value="50" oninput="atualizarSlider(this)"></div>
        <div class="slider-group"><label>Distância entre Colunas (X): <span id="val_dist_colunas">180</span></label><input type="range" id="dist_colunas" min="100" max="300" value="180" oninput="atualizarSlider(this)"></div>
        <div class="slider-group"><label>Alinhamento do Topo (Y): <span id="val_y_topo">100</span></label><input type="range" id="y_topo" min="0" max="300" value="100" oninput="atualizarSlider(this)"></div>
        <div class="slider-group"><label>Alinhamento do Fundo (Y): <span id="val_y_fim">420</span></label><input type="range" id="y_fim" min="150" max="450" value="420" oninput="atualizarSlider(this)"></div>
        <div class="slider-group"><label>Espaço entre Alternativas: <span id="val_spX">24</span></label><input type="range" id="spX" min="10" max="80" value="24" oninput="atualizarSlider(this)"></div>

        <h4 style="border-bottom: 1px solid #ddd; padding-bottom: 5px; margin-top: 20px;">📝 Respostas Corretas</h4>
        <div class="grid-gabarito" id="containerGabarito"></div>

        <button class="btn-action" onclick="salvarConfig()" style="margin-top: 20px;">💾 SALVAR CONFIGURAÇÕES</button>
    </div>
</div>

<!-- MODAL DA CÂMERA -->
<div id="modalCamera" class="modal">
    <div class="modal-content">
        <button class="btn-close-modal" onclick="fecharModal()">&times;</button>
        <h3 id="nomeAlunoModal">Lendo Prova...</h3>
        
        <div class="video-container">
            <video id="webcamScan" width="600" height="450" autoplay playsinline style="display:none;"></video>
            <!-- Canvas onde o OpenCV desenhará os frames da câmera com os overlays -->
            <canvas id="canvasOverlay" width="600" height="450"></canvas>
        </div>
        
        <!-- Canvas oculto para fazer o crop/warp -->
        <canvas id="canvasHidden" width="600" height="450" style="display: none;"></canvas>
        
        <div id="resultadoFinal" style="margin-top: 15px; font-size: 18px; font-weight: bold; display: none;"></div>
        <button class="btn-action btn-danger" id="btnTentarNovamente" style="display:none;" onclick="reiniciarCaptura()">🔄 Tentar Novamente</button>
    </div>
</div>

<!-- OPENCV.JS -->
<script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>

<script>
    // --- VARIÁVEIS GLOBAIS DE ESTADO ---
    let calib = {
        totalQuestoes: 10,
        numColunas: 2,
        valorProva: 10.0,
        x_inicial: 50,
        dist_colunas: 180,
        y_topo: 100,
        y_fim: 420,
        spX: 24,
        respostas: []
    };

    let cvReady = false;
    let streaming = false;
    let video = document.getElementById('webcamScan');
    let canvasOverlay = document.getElementById('canvasOverlay');
    let ctxOverlay = canvasOverlay.getContext('2d', { willReadFrequently: true });
    let scanStream = null;
    let loopFrameId;

    // Variáveis de Estabilização e Captura
    let contadorEstavel = 0;
    const LIMIAR_ESTAVEL = 12; // Aprox 0.4s a 30fps
    let travaCaptura = false;
    let imgWarped = null;

    // --- INICIALIZAÇÃO ---
    function onOpenCvReady() {
        document.getElementById('statusCv').style.display = 'none';
        cvReady = true;
        carregarConfigDoStorage();
        renderizarGabarito();
    }

    function trocarAba(abaId, btn) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(abaId).classList.add('active');
        btn.classList.add('active');
    }

    // --- LÓGICA DE INTERFACE (CALIBRAGEM) ---
    function mudarQtdQuestoes(delta) {
        let novaQtd = calib.totalQuestoes + delta;
        if (novaQtd >= 1 && novaQtd <= 40) {
            calib.totalQuestoes = novaQtd;
            document.getElementById('txtQtdQuestoes').innerText = calib.totalQuestoes;
            renderizarGabarito();
            salvarConfig();
        }
    }

    function renderizarGabarito() {
        let container = document.getElementById('containerGabarito');
        container.innerHTML = '';
        const letras = ['A', 'B', 'C', 'D', 'E'];
        
        for (let i = 0; i < calib.totalQuestoes; i++) {
            let respAtual = calib.respostas[i] || 'A';
            let html = `<div class="questao-item">
                <label>Q${String(i+1).padStart(2, '0')}:</label>
                <select id="gab_q${i}" onchange="salvarConfig()">`;
            letras.forEach(l => {
                html += `<option value="${l}" ${respAtual === l ? 'selected' : ''}>${l}</option>`;
            });
            html += `</select></div>`;
            container.insertAdjacentHTML('beforeend', html);
        }
    }

    function atualizarSlider(el) {
        document.getElementById(`val_${el.id}`).innerText = el.value;
        salvarConfig();
    }

    function salvarConfig() {
        calib.valorProva = parseFloat(document.getElementById('inputValorProva').value) || 10.0;
        calib.numColunas = parseInt(document.getElementById('selectColunas').value);
        calib.x_inicial = parseInt(document.getElementById('x_inicial').value);
        calib.dist_colunas = parseInt(document.getElementById('dist_colunas').value);
        calib.y_topo = parseInt(document.getElementById('y_topo').value);
        calib.y_fim = parseInt(document.getElementById('y_fim').value);
        calib.spX = parseInt(document.getElementById('spX').value);
        
        calib.respostas = [];
        for (let i = 0; i < calib.totalQuestoes; i++) {
            let select = document.getElementById(`gab_q${i}`);
            if(select) calib.respostas.push(select.value);
        }
        
        localStorage.setItem('corrigepro_calib', JSON.stringify(calib));
    }

    function carregarConfigDoStorage() {
        let salvo = localStorage.getItem('corrigepro_calib');
        if (salvo) {
            let data = JSON.parse(salvo);
            calib = { ...calib, ...data };
            
            document.getElementById('inputValorProva').value = calib.valorProva;
            document.getElementById('selectColunas').value = calib.numColunas;
            document.getElementById('txtQtdQuestoes').innerText = calib.totalQuestoes;
            
            ['x_inicial', 'dist_colunas', 'y_topo', 'y_fim', 'spX'].forEach(id => {
                document.getElementById(id).value = calib[id];
                document.getElementById(`val_${id}`).innerText = calib[id];
            });
        }
    }

    // --- LÓGICA DE CÂMERA E OPENCV ---
    function abrirCamera(nomeAluno) {
        if (!cvReady) return alert("Aguarde o OpenCV carregar.");
        document.getElementById('nomeAlunoModal').innerText = `Escanear: ${nomeAluno}`;
        document.getElementById('modalCamera').style.display = 'block';
        document.getElementById('resultadoFinal').style.display = 'none';
        document.getElementById('btnTentarNovamente').style.display = 'none';
        
        reiniciarCaptura();

        navigator.mediaDevices.getUserMedia({ video: { width: 600, height: 450, facingMode: "environment" }, audio: false })
            .then(stream => {
                scanStream = stream;
                video.srcObject = stream;
                video.play();
                video.onloadeddata = () => {
                    streaming = true;
                    processVideo();
                };
            }).catch(err => alert("Erro ao acessar câmera: " + err));
    }

    function fecharModal() {
        document.getElementById('modalCamera').style.display = 'none';
        streaming = false;
        if (scanStream) scanStream.getTracks().forEach(track => track.stop());
        cancelAnimationFrame(loopFrameId);
    }

    function reiniciarCaptura() {
        travaCaptura = false;
        contadorEstavel = 0;
        document.getElementById('resultadoFinal').style.display = 'none';
        document.getElementById('btnTentarNovamente').style.display = 'none';
        if(imgWarped) { imgWarped.delete(); imgWarped = null; }
    }

    // Loop de renderização em tempo real (Tradução do def atualizar_frame do Python)
    function processVideo() {
        if (!streaming) return;

        let src = new cv.Mat(video.height, video.width, cv.CV_8UC4);
        let dst = new cv.Mat(video.height, video.width, cv.CV_8UC4);
        let gray = new cv.Mat();
        let blur = new cv.Mat();
        let thresh = new cv.Mat();
        let contours = new cv.MatVector();
        let hierarchy = new cv.Mat();

        try {
            ctxOverlay.drawImage(video, 0, 0, video.width, video.height);
            let imageData = ctxOverlay.getImageData(0, 0, video.width, video.height);
            src.data.set(imageData.data);
            src.copyTo(dst);

            if (!travaCaptura) {
                // Processamento de imagem
                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
                cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);
                cv.adaptiveThreshold(blur, thresh, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 51, 11);
                
                cv.findContours(thresh, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let anchors = [];
                for (let i = 0; i < contours.size(); i++) {
                    let cnt = contours.get(i);
                    let peri = cv.arcLength(cnt, true);
                    let approx = new cv.Mat();
                    cv.approxPolyDP(cnt, approx, 0.04 * peri, true);
                    
                    if (approx.rows === 4) {
                        let rect = cv.boundingRect(approx);
                        let area = rect.width * rect.height;
                        let ratio = rect.width / rect.height;
                        
                        // Filtros de tamanho e proporção (igual ao Python)
                        if (area > 300 && area < 30000 && ratio > 0.7 && ratio < 1.3) {
                            let M = cv.moments(cnt, false);
                            if (M.m00 !== 0) {
                                let cx = Math.round(M.m10 / M.m00);
                                let cy = Math.round(M.m01 / M.m00);
                                anchors.push({x: cx, y: cy});
                            }
                        }
                    }
                    approx.delete();
                }

                // Desenhar Status e Lógica de Estabilização
                let statusText = "Alinhe os 4 cantos da folha...";
                let statusColor = [255, 0, 0, 255]; // Vermelho

                if (anchors.length === 4) {
                    for(let p of anchors) {
                        cv.circle(dst, new cv.Point(p.x, p.y), 8, [0, 255, 0, 255], -1);
                    }
                    
                    contadorEstavel++;
                    let pct = Math.min(Math.round((contadorEstavel / LIMIAR_ESTAVEL) * 100), 100);
                    statusText = `Estabilizando... ${pct}%`;
                    statusColor = [255, 255, 0, 255]; // Amarelo

                    if (contadorEstavel >= LIMIAR_ESTAVEL) {
                        executarCaptura(src, anchors);
                        travaCaptura = true;
                    }
                } else {
                    contadorEstavel = 0; // Reseta se perdeu a folha
                }

                cv.putText(dst, statusText, new cv.Point(10, 30), cv.FONT_HERSHEY_SIMPLEX, 0.6, statusColor, 2);
                cv.putText(dst, `Questoes: ${calib.totalQuestoes} | Colunas: ${calib.numColunas}`, new cv.Point(10, 60), cv.FONT_HERSHEY_SIMPLEX, 0.5, [255,255,255,255], 1);
                
                cv.imshow('canvasOverlay', dst);
            }

        } catch(e) {
            console.error(e);
        }

        // Limpeza de memória do OpenCV
        src.delete(); dst.delete(); gray.delete(); blur.delete(); thresh.delete(); contours.delete(); hierarchy.delete();

        if (!travaCaptura) {
            loopFrameId = requestAnimationFrame(processVideo);
        }
    }

    // --- CORREÇÃO OMR (Tradução do processar_correcao do Python) ---
    function executarCaptura(srcMat, anchors) {
        // Ordenação dos 4 pontos
        anchors.sort((a, b) => a.y - b.y);
        let top = anchors.slice(0, 2).sort((a, b) => a.x - b.x);
        let bot = anchors.slice(2, 4).sort((a, b) => a.x - b.x);
        
        let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [top[0].x, top[0].y, top[1].x, top[1].y, bot[0].x, bot[0].y, bot[1].x, bot[1].y]);
        let dW = 600, dH = 450;
        let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, dW, 0, 0, dH, dW, dH]);
        
        let M = cv.getPerspectiveTransform(srcTri, dstTri);
        imgWarped = new cv.Mat();
        cv.warpPerspective(srcMat, imgWarped, M, new cv.Size(dW, dH));
        
        // Preparar Threshold do corte
        let gray = new cv.Mat();
        cv.cvtColor(imgWarped, gray, cv.COLOR_RGBA2GRAY, 0);
        cv.GaussianBlur(gray, gray, new cv.Size(3, 3), 0, 0, cv.BORDER_DEFAULT);
        let warpedThresh = new cv.Mat();
        cv.threshold(gray, warpedThresh, 0, 255, cv.THRESH_BINARY_INV + cv.THRESH_OTSU);

        // Processamento das Respostas
        let acertos = 0;
        let dW_limit = dW, dH_limit = dH;
        let questoesPorColuna = Math.ceil(calib.totalQuestoes / calib.numColunas);
        const letras = ['A', 'B', 'C', 'D', 'E'];

        for (let q = 0; q < calib.totalQuestoes; q++) {
            let colAtual = Math.floor(q / questoesPorColuna);
            let linhaIdx = q % questoesPorColuna;
            
            // Compensação mágica do Python
            let compensacaoColuna = 0;
            if (colAtual === 1) compensacaoColuna = 30;
            else if (colAtual === 2) compensacaoColuna = 25;

            let xBaseColuna = calib.x_inicial + (colAtual * calib.dist_colunas) + compensacaoColuna;
            let passoVertical = questoesPorColuna > 1 ? (calib.y_fim - calib.y_topo) / (questoesPorColuna - 1) : 0;
            let yPonto = Math.round(calib.y_topo + (linhaIdx * passoVertical));

            let valoresAlternativas = [];
            for (let i = 0; i < 5; i++) {
                let xPonto = Math.round(xBaseColuna + (i * calib.spX));
                
                // Extração da Região (ROI)
                let totalPixels = 0;
                if (yPonto >= 12 && yPonto + 12 < dH_limit && xPonto >= 12 && xPonto + 12 < dW_limit) {
                    let rect = new cv.Rect(xPonto - 12, yPonto - 12, 24, 24);
                    let roi = warpedThresh.roi(rect);
                    totalPixels = cv.countNonZero(roi);
                    roi.delete();
                }
                valoresAlternativas.push(totalPixels);
                
                // Desenha mira no display
                cv.circle(imgWarped, new cv.Point(xPonto, yPonto), 4, [0, 255, 255, 255], -1);
            }

            // Identificar qual foi marcada
            let maxVal = Math.max(...valoresAlternativas);
            let idxMarcado = valoresAlternativas.indexOf(maxVal);
            let respostaAluno = maxVal > 110 ? letras[idxMarcado] : "-";
            
            let gabaritoCorreto = calib.respostas[q];
            if (respostaAluno === gabaritoCorreto) {
                acertos++;
            }
        }

        // Cálculos Finais
        let fator = calib.valorProva / calib.totalQuestoes;
        let notaFinal = acertos * fator;
        let mediaCorte = calib.valorProva * 0.6;
        let corNota = notaFinal >= mediaCorte ? [0, 255, 0, 255] : [255, 0, 0, 255]; // Verde ou Vermelho

        // Tarja superior preta
        cv.rectangle(imgWarped, new cv.Point(0, 0), new cv.Point(600, 70), [0, 0, 0, 255], -1);
        cv.putText(imgWarped, `Acertos: ${acertos}/${calib.totalQuestoes}`, new cv.Point(15, 25), cv.FONT_HERSHEY_SIMPLEX, 0.6, [255, 255, 255, 255], 2);
        cv.putText(imgWarped, `Fator/Q: ${fator.toFixed(2)}`, new cv.Point(15, 55), cv.FONT_HERSHEY_SIMPLEX, 0.6, [255, 255, 255, 255], 2);
        cv.putText(imgWarped, `NOTA: ${notaFinal.toFixed(2)}`, new cv.Point(350, 45), cv.FONT_HERSHEY_SIMPLEX, 1.0, corNota, 3);

        cv.imshow('canvasOverlay', imgWarped);

        // Atualiza UI
        document.getElementById('resultadoFinal').innerHTML = `Capturado! Nota: <span style="color:${notaFinal >= mediaCorte ? 'green' : 'red'};">${notaFinal.toFixed(2)}</span>`;
        document.getElementById('resultadoFinal').style.display = 'block';
        document.getElementById('btnTentarNovamente').style.display = 'block';
        
        // Atualiza a tabela na aba principal
        document.getElementById('nota-joao').innerText = notaFinal.toFixed(2);
        document.getElementById('nota-joao').style.color = notaFinal >= mediaCorte ? 'green' : 'red';

        // Limpeza
        srcTri.delete(); dstTri.delete(); M.delete(); gray.delete(); warpedThresh.delete();
    }
</script>
</body>
</html>
